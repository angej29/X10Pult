name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Ключ підпису — лише в секретах репозиторію (Settings > Secrets and variables > Actions),
      # щоб кожна нова версія ставилася поверх попередньої, а сам ключ не був публічним.
      - name: Restore signing key
        env:
          X10_KEYSTORE_BASE64: ${{ secrets.X10_KEYSTORE_BASE64 }}
          X10_KEY_PASSWORD: ${{ secrets.X10_KEY_PASSWORD }}
        run: |
          if [ -z "$X10_KEYSTORE_BASE64" ] || [ -z "$X10_KEY_PASSWORD" ]; then
            echo "::error::Add X10_KEYSTORE_BASE64 and X10_KEY_PASSWORD in Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$X10_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/x10pult.p12"
          alias=$(keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/x10pult.p12" -storepass "$X10_KEY_PASSWORD" \
            | sed -n 's/^Alias name: //p' | head -1)
          if [ -z "$alias" ]; then
            echo "::error::Signing key cannot be read: check X10_KEYSTORE_BASE64 and X10_KEY_PASSWORD"
            exit 1
          fi
          echo "X10_KEYSTORE_FILE=$RUNNER_TEMP/x10pult.p12" >> "$GITHUB_ENV"
          echo "X10_KEY_ALIAS=$alias" >> "$GITHUB_ENV"

      - name: Build
        env:
          X10_KEY_PASSWORD: ${{ secrets.X10_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk X10Pult-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: X10Pult-apk
          path: X10Pult-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: X10 Pult build ${{ github.run_number }}
          files: X10Pult-${{ github.run_number }}.apk
